name: Testing
on:
  push:
    branches:
      - main
      - "v*"
    tags:
      - "v*"
  pull_request:

# Cancel earlier runs of this workflow on the same PR when a new commit is pushed.
# Pushes to main/v*/tags keep all runs (cancel-in-progress only fires for pull_request events).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x

      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Lint Go Code
        run: staticcheck ./...

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: accountant
          POSTGRES_PASSWORD: theeaglefliesatdawn
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOPATH: ${{ github.workspace }}/go
      GOBIN: ${{ github.workspace }}/go/bin
      GOTEST_GITHUB_ACTIONS: 1
      DATABASE_URL: "postgres://accountant:theeaglefliesatdawn@localhost:5432/postgres?sslmode=disable"
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/go.bengfort.dev/ledger
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x

      - name: Cache Speedup
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          path: ${{ env.GOPATH }}/src/go.bengfort.dev/ledger

      - name: Install Dependencies
        run: |
          go version
          go install go.rtnl.ai/enumify/cmd/enumify@latest

      - name: Code Generation
        run: go generate ./...

      - name: Run Unit Tests
        run: go test -v -coverprofile=coverage.txt -covermode=atomic --race ./...

  build:
    name: Go Build
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}/go
      GOBIN: ${{ github.workspace }}/go/bin
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/go.bengfort.dev/ledger
    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x

      - name: Cache Speedup
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          path: ${{ env.GOPATH }}/src/go.bengfort.dev/ledger
      - name: Install Dependencies
        run: |
          go version

      - name: Build
        run: go build ./cmd/...
